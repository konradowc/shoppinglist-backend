plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'konradowc.shopping'
version = '0.0.1-SNAPSHOT'
description = 'Backend API with Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	developmentOnly 'org.springframework.boot:spring-boot-devtools' // for auto-restarts (like Vite)
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	implementation 'org.springframework.boot:spring-boot-starter-validation' // for NotBlank
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // for Spring Data JPA (DB connection)
	runtimeOnly 'org.postgresql:postgresql'								   //
    compileOnly 'org.projectlombok:lombok:1.18.30'				// for Lombok (automatic getters & setters)
    annotationProcessor 'org.projectlombok:lombok:1.18.30'		//
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0" // for OpenAPI (Swagger)
	implementation 'org.passay:passay:1.6.6' // for random password generation
}

tasks.named('test') {
	useJUnitPlatform()
}

